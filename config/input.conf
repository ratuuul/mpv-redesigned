# =============================================================================
#  mpv - key bindings
#
#  Navigation goes through scripts/nav_shim.lua, which detects the active
#  skin: with Liquid Glass it forwards to the skin's centred macOS-style
#  overlays, with ModernZ it uses native commands and lets ModernZ draw its
#  own feedback.  One keymap, both skins.
#
#  Everything not listed here keeps mpv's built-in default binding.
# =============================================================================

# ---------------------------------------------------------- navigation ----
WHEEL_UP     script-message-to nav_shim nav-scroll-up
WHEEL_DOWN   script-message-to nav_shim nav-scroll-down

LEFT         repeatable script-message-to nav_shim nav-seek -5
RIGHT        repeatable script-message-to nav_shim nav-seek  5
Shift+LEFT   repeatable seek -1 exact
Shift+RIGHT  repeatable seek  1 exact
Ctrl+LEFT    repeatable seek -10 exact
Ctrl+RIGHT   repeatable seek  10 exact
PGUP         seek 60
PGDWN        seek -60
,            frame-back-step
.            frame-step

UP           repeatable script-message-to nav_shim nav-volume  5
DOWN         repeatable script-message-to nav_shim nav-volume -5

# Number keys jump to a percentage of the video (0 = start, 1 = 10%, ...).
# Bound for the top row and the numpad, so the numpad seeks too.
0    script-message-to nav_shim nav-seek-percent 0
1    script-message-to nav_shim nav-seek-percent 10
2    script-message-to nav_shim nav-seek-percent 20
3    script-message-to nav_shim nav-seek-percent 30
4    script-message-to nav_shim nav-seek-percent 40
5    script-message-to nav_shim nav-seek-percent 50
6    script-message-to nav_shim nav-seek-percent 60
7    script-message-to nav_shim nav-seek-percent 70
8    script-message-to nav_shim nav-seek-percent 80
9    script-message-to nav_shim nav-seek-percent 90
KP0  script-message-to nav_shim nav-seek-percent 0
KP1  script-message-to nav_shim nav-seek-percent 10
KP2  script-message-to nav_shim nav-seek-percent 20
KP3  script-message-to nav_shim nav-seek-percent 30
KP4  script-message-to nav_shim nav-seek-percent 40
KP5  script-message-to nav_shim nav-seek-percent 50
KP6  script-message-to nav_shim nav-seek-percent 60
KP7  script-message-to nav_shim nav-seek-percent 70
KP8  script-message-to nav_shim nav-seek-percent 80
KP9  script-message-to nav_shim nav-seek-percent 90

# ----------------------------------------------------------- playback ----
# Right-click toggles pause (the skin renders its own pause indicator).
MBTN_RIGHT   cycle pause

# --------------------------------------------------------------- speed ----
{             script-message-to nav_shim nav-speed 1
}             script-message-to nav_shim nav-speed -1
BS            script-message-to nav_shim nav-speed-reset

# -------------------------------------------------------------- audio ----
a             cycle audio
Alt+a         cycle audio down
A             script-binding uosc/audio
[             add audio-delay -0.1
]             add audio-delay 0.1
\             set audio-delay 0

# ---------------------------------------------------------- subtitles ----
v             cycle sub
Alt+Shift+v   cycle sub down
Alt+v         cycle sub-visibility
# Subtitle menu: pick a track, or download one from OpenSubtitles.
V             script-binding uosc/subtitles
# Download subtitles from the online providers.
D             script-binding uosc/download-subtitles
# Add a subtitle file from disk.
# NOTE: bare `sub-add` is invalid - mpv validates argument count at parse time
# and aborts startup with "[e] Command sub-add: required argument url not set".
# uosc/load-subtitles opens a file browser and calls sub-add with a real path.
Ctrl+v        script-binding uosc/load-subtitles
# Load an external subtitle file (same thing, through the menu browser).
Alt+d         script-binding uosc/load-subtitles
z             add sub-delay -0.1
Z             add sub-delay 0.1
Ctrl+z        set sub-delay 0
x             add sub-pos -1
X             add sub-pos 1
r             add sub-scale +0.1
R             add sub-scale -0.1
Ctrl+j        add sub-font-size 2
Ctrl+J        add sub-font-size -2

# -------------------------------------------------------- screenshots ----
# mpv itself only writes to the console, so show a proper OSD message.
s             show-text "Screenshot saved"; screenshot
S             show-text "Screenshot saved - video only"; screenshot video
Ctrl+s        show-text "Screenshot saved - video only"; screenshot video

# ================================================================ extras ==

# --------------------------------------------- YouTube / stream quality --
# Lists the REAL formats the server offers and switches on the fly.
# (quality-menu overrides uosc's own stream-quality binding.)
F             script-binding quality_menu/video_formats_toggle
Alt+f         script-binding quality_menu/audio_formats_toggle
Ctrl+r        script-binding quality_menu/reload

# ------------------------------------------------------- recent files --
Ctrl+Shift+r  script-binding recentmenu/open

# ------------------------------------------- YouTube subtitle picker --
# Lists every subtitle of the current YouTube video: the creator-uploaded
# ones plus the auto-generated captions, in all offered languages.
Alt+s         script-binding ytsubs/menu
Alt+Shift+s   script-binding ytsubs/menu-secondary

# NOTE: two keys are claimed by the scripts themselves and are NOT
# rebound here, to avoid fighting them:
#   b  -> sponsorblock_minimal.lua (skip sponsor segments)
#   W  -> webm.lua (cut a clip to WebM)

# ------------------------------------------------------------- fetching --
# Fetch the whole file into the on-disk cache, then play it from there.
Alt+Shift+b  apply-profile fetch-all; loadfile "${path}" replace
# Back to normal streaming: a rolling buffer ahead of the picture.
Alt+Shift+n  apply-profile fetch-all restore; loadfile "${path}" replace

# ------------------------------------------------------------- profiles --
Alt+1         apply-profile fast
Alt+2         apply-profile max-quality
Alt+3         apply-profile cine
Alt+4         apply-profile shaders-anime
Alt+5         apply-profile shaders-off
Alt+6         apply-profile subs-panel
Alt+7         apply-profile subs-cinema
Alt+8         apply-profile loudnorm
Alt+9         apply-profile dynaudnorm
Alt+0         apply-profile gpu-vulkan

# ------------------------------------------------- native mpv selections --
# mpv 0.41 ships select.lua, which provides these menus natively.
# Its own defaults are kept (g-h history, g-w watch later, g-b bindings,
# g-m main menu), so only the context-menu binding is added here.
Shift+MBTN_RIGHT  script-binding select/menu

# --- background image ---
# Idle photo background (scripts/bg.lua + script-opts/bg.conf).
# Fetches a new photo and shows it whenever mpv has nothing to play.
Ctrl+Shift+K  script-binding bg/next

# --- reopen last media ---
# Double-click the window to reopen the last played media and resume it
# from the exact position it was left at (scripts/lasthit.lua).
# NOTE: this takes over mpv's default double-click (fullscreen toggle);
# press f for fullscreen instead.
MBTN_LEFT_DBL  script-binding lasthit/play

