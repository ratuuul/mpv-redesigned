# =============================================================================
#  mpv - master configuration
#  Build:   mpv v0.41.0-dev-g41f6a6450 (Dec 2025) / libplacebo v7.358.0
#  Machine: Windows 10 IoT Enterprise LTSC 19044 - Intel(R) Graphics (iGPU)
#           panel 1920x1200 @ 60Hz
#
#  Layout
#    conf/video.conf       renderer, hardware decode, scaling, tonemapping
#    conf/audio.conf       WASAPI output, volume, ReplayGain, track selection
#    conf/subtitles.conf   font, colours, borders, margins
#    conf/interface.conf   window chrome, OSD, screenshots, input
#    conf/profiles.conf    conditional + on-demand profiles
#
#  Skin: the active one lives in scripts/, the other is parked in skins/.
#        Run  switch-skin.cmd to swap between Liquid Glass and ModernZ.
# =============================================================================

# ---------------------------------------------------------------- includes --
include=~~/conf/video.conf
include=~~/conf/audio.conf
include=~~/conf/subtitles.conf
include=~~/conf/interface.conf
include=~~/conf/profiles.conf

# --------------------------------------------------------------------- skin --
# Exactly one skin is loaded: Liquid Glass (uosc fork) by default,
# ModernZ is parked in skins/. Switch with switch-skin.cmd.

# ------------------------------------------------------------------ general --
# mpv's own OSC is disabled: the skin draws the controls.
osc=no
osd-bar=no

# keep playing (paused) after a file ends, so the skin stays interactive
keep-open=yes
keep-open-pause=yes

# resume where you left off
save-position-on-quit=yes
resume-playback=yes
# mtime check off: remote files (http/smb) have no mtime, and the check
# would silently drop the saved position for them.
resume-playback-check-mtime=no
# write the source path into each watch-later file, so scripts can map a
# watch-later entry back to the file it belongs to.
write-filename-in-watch-later-config=yes
# Only persist what is worth restoring (no stray volume/mute changes).
watch-later-options=start,speed,pitch,aid,sid,sub-delay,sub-scale

# watch history (off by default upstream; needed by recentmenu.lua)
save-watch-history=yes

# folder / playlist handling
autocreate-playlist=same
directory-mode=recursive

# Windows integration: SMTC flyout + media keys
media-controls=yes
input-media-keys=yes

# ---------------------------------------------------------------- YouTube --
# yt-dlp lives in this config dir, so ytdl_hook finds it first.
#
# Three yt-dlp options are passed, comma-separated:
#
#   sub-langs=...            Creator-uploaded subtitles in these languages.
#                            mpv turns each into a normal subtitle track, so
#                            they appear in `v`, in the skin's Subtitles menu
#                            and in mpv's own track list. `|` is regex
#                            alternation inside yt-dlp. Auto-generated
#                            captions are deliberately NOT requested: 100+
#                            tracks per video. Use the ytsubs menu (Alt+s).
#
#   cookies-from-browser=firefox
#                            Reads the YouTube session out of the live Firefox
#                            profile. This is what gets past age gates
#                            ("Sign in to confirm your age"), members-only
#                            videos and "confirm you're not a bot". Firefox is
#                            the only usable store here - Chrome/Edge/Chromium
#                            keep cookies DPAPI/app-bound encrypted and yt-dlp
#                            aborts with "Failed to decrypt with DPAPI".
#                            Firefox may stay open while playing; yt-dlp copies
#                            the database instead of locking it.
#
#   js-runtimes=node         yt-dlp 2026 only enables the `deno` runtime by
#                            default. Node IS installed here, but unless it is
#                            named explicitly yt-dlp reports "JS runtimes: none",
#                            the signature + "n" challenges fail, YouTube
#                            forces SABR streaming and EVERY video comes back
#                            with no usable formats. Do not remove this.
#
# PARSING RULES - these are mpv's rules, not yt-dlp's:
#   * every entry MUST be key=value. A bare key with no "=" swallows the next
#     entry and silently corrupts the yt-dlp command line, so nothing loads.
#   * a value MUST NOT contain a comma - mpv splits the whole line on commas.
#     When a yt-dlp option needs several values, use `|` inside the value
#     (yt-dlp's own list separator) instead of a comma.
#   * `#` starts a comment in an mpv config file even mid-line, so any value
#     containing `#` has to be wrapped in double quotes.
#
# TO DISABLE: put a `#` at the start of the ytdl-raw-options line below and
# add a plain `ytdl-raw-options=sub-langs=...` line. Normal playback is
# unaffected either way; only age-restricted / members-only / bot-checked
# videos go back to failing. `cookies-from-browser` is the fragile part: if
# Firefox is uninstalled, its profile is renamed or the profile is deleted,
# yt-dlp aborts the whole extraction ("could not find firefox cookies
# database") and every YouTube URL stops loading. `js-runtimes=node` is safe
# to keep on its own.
ytdl-raw-options=sub-langs=(en|ja|de|es|fr|it|ru|pt|pl|nl|sv|tr|ko|zh).*,cookies-from-browser=firefox,js-runtimes=node

# keep the player from hogging the CPU while idle
stop-screensaver=yes

# logging - change to `terminal=yes` for live output
log-file=~~/mpv.log
msg-level=all=warn,vo=warn,vd=warn,cplayer=warn
