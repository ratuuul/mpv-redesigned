# =============================================================================
#  AUDIO - WASAPI output, volume, ReplayGain, track selection
# =============================================================================

# ------------------------------------------------------------------ output --
# WASAPI is the native Windows backend; mpv already prefers it over the
# wrapper drivers (jack/openal/sdl).
ao=wasapi
# Shared mode, so system sounds keep working while mpv plays.
audio-exclusive=no
# Shown in the Windows volume mixer / sound control panel.
audio-client-name=mpv

# ---------------------------------------------------------------- channels --
# auto-safe = use the system's own preferred speaker layout.
audio-channels=auto-safe
# Prevent surround->stereo downmix from clipping.
audio-normalize-downmix=yes

# ----------------------------------------------------------------- volume --
# mpv's software volume is cubic (100 = 0 dB). Keep 100 as the working
# point and let ReplayGain do the level matching.
volume=100
volume-max=130
# Fixed dB offset on top of everything else.
volume-gain=0

# ------------------------------------------------------------- replaygain --
# Applied on top of the volume curve, so it is never clipped by volume-max.
replaygain=track
replaygain-preamp=0
# Clipping protection is OFF. `yes` would lower the gain of hot tracks instead
# of letting them clip; track mode with a 0 dB preamp rarely needs it. Turn it
# on if loud masters distort.
replaygain-clip=no

# ---------------------------------------------------------------- resample --
# Leave the device's native sample rate alone (no resampling = best).
# audio-samplerate=48000
# Filter size 32 instead of the default 16 - noticeably cleaner when a
# resample does happen.
audio-resample-filter-size=32
audio-resample-phase-shift=10

# ---------------------------------------------------------------- gapless --
gapless-audio=weak

# ------------------------------------------------------------------ pitch --
# Uses scaletempo2 (WSOLA) - works without librubberband, which this build
# does not have.
audio-pitch-correction=yes

# -------------------------------------------------------- track selection --
# `auto` + `track-auto-selection` picks sensible streams from containers.
aid=auto
sid=auto
track-auto-selection=yes
slang=eng,en,jpn
# Pick up sidecar audio/subtitle files next to the video.
audio-file-auto=fuzzy
sub-auto=fuzzy
audio-file-paths=~~/audio
sub-file-paths=sub;subs;subtitles;~~/subtitles

# ------------------------------------------------------- loudness (opt-in) --
# EBU R128 / dynamic normalisation is available as profiles
# `loudnorm` and `dynaudnorm` (see conf/profiles.conf) - deliberately NOT
# on by default, since single-pass loudnorm can pump and costs CPU.

