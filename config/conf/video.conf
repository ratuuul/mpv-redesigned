# =============================================================================
#  VIDEO - renderer, decode, scaling, colour
#
#  Measured on this machine (1920x1200 panel, Intel iGPU, ~2 GB shared VRAM):
#    - d3d11va (zero-copy) and vulkan hwdec both decode 1080p AND 4K with
#      0 dropped frames.
#    - Their rendered output is pixel-identical (PSNR 66.5 dB) - so the choice
#      is about driver maturity, not picture quality.
#    - spline36 - ewa_lanczossharp - ewa_lanczos4sharpest, plus interpolation
#      and debanding, ALL run with 0 dropped frames at 1920x1200.
#  => the iGPU has enough headroom for the full-quality stack.
# =============================================================================

# ----------------------------------------------------------------- renderer --
vo=gpu-next
# d3d11 is Intel's best-supported Windows path and the only one where
# d3d11va zero-copy applies. (Vulkan output is available via the
# `gpu-vulkan` profile if you ever want to A/B it.)
gpu-api=d3d11
gpu-context=d3d11

# --------------------------------------------------------------- decoding --
# d3d11va keeps frames in GPU memory; zero-copy skips the extra
# GPU->GPU copy, which is the single biggest win on shared-memory Intel.
hwdec=d3d11va
d3d11va-zero-copy=yes
# If you ever see green/corrupt edges, delete the line above and re-test.

# ---------------------------------------------------------------- scaling --
# Luma: EWA Lanczos sharp - the sharpest good-looking scaler, and free here.
# Chroma: spline36 - chroma is low-frequency, EWA on chroma is wasted work.
scale=ewa_lanczossharp
cscale=spline36
# Downscale (4K -> 1080p): mitchell is soft and free of ringing.
dscale=mitchell
# Suppress ringing on the EWA luma scaler.
scale-antiring=0.6
# Only rescale when the window is actually bigger/smaller than the video.
scaler-resizes-only=yes
# gpu-next defaults that we keep explicitly for clarity:
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# --------------------------------------------------------------- banding --
# Removes 8-bit banding from streamed/compressed video. Costs <1 ms.
deband=yes
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=24

# ---------------------------------------------------------- motion / sync --
# The panel is 60 Hz and most content is 23.976/24 fps, which judders badly.
# display-resample retimes to the panel and interpolation blends the
# in-between frames - verified 0 dropped frames on this iGPU.
video-sync=display-resample
interpolation=yes
tscale=oversample

# ------------------------------------------------------------------ colour --
# 8-bit SDR panel: blue-noise dither, no temporal dither (LCD flicker).
dither=fruit
dither-depth=8
temporal-dither=no
# Windows 10 has no usable HDR here, so let libplacebo map HDR -> SDR.
tone-mapping=spline
hdr-compute-peak=no
# libplacebo's HDR peak detection is documented as "prohibitively slow on
# weaker integrated GPUs" - disable it.
libplacebo-opts=peak_detect=no
# Verified no-op on this build (output identical to the default), but set
# explicitly so the intent is clear.
target-colorspace-hint=auto
# Windows only exposes WCS profiles here, which mpv cannot read, and auto
# detection has produced both over- and under-saturation. Keep it off.
icc-profile-auto=no

# ----------------------------------------------------------------- shaders --
# Compile user GLSL shaders to a cache so the first play of a file does not
# stutter while the driver builds the pipeline.
gpu-shader-cache-dir=~~/cache/gpu-shaders

