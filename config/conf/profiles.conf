# =============================================================================
#  PROFILES
#
#  Conditional profiles are evaluated automatically by mpv's bundled
#  auto_profiles.lua (profile-cond). Manual profiles are applied on demand
#  with  apply-profile <name>  (see input.conf for the key bindings).
# =============================================================================

# ============================ CONDITIONAL ====================================

# --------------------------------------------------------------- anime ------
# Anime line art genuinely benefits from a CNN restore pass - libplacebo
# has no equivalent. Restore_CNN_M runs at SOURCE resolution (one extra
# full-screen pass), so the actual upscale is still done by EWA Lanczos.
# CfL_Prediction infers chroma from luma, which helps 4:2:0 anime edges.
# Verified 0 dropped frames on this iGPU.
[anime-restore]
profile-desc=Anime: line-art restore + chroma-from-luma
profile-cond=path and path:lower():find("anime") ~= nil
profile-restore=copy
glsl-shaders=~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/CfL_Prediction.glsl

# Same, but the softer variant for already-decent 720p sources.
[anime-restore-soft]
profile-desc=Anime (soft restore): line-art restore + chroma-from-luma
profile-cond=path and path:lower():find("anime") ~= nil and height <= 720
profile-restore=copy
glsl-shaders=~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl;~~/shaders/CfL_Prediction.glsl

# ============================== MANUAL ======================================

# ------------------------------------------------------------ performance --
# The escape hatch if the GPU ever gets busy: cheap scaler, no
# interpolation, minimal debanding.
[fast]
profile-desc=Fast: bilinear, no interpolation, no debanding
scale=bilinear
cscale=bilinear
dscale=bilinear
interpolation=no
deband=no
video-sync=display-resample

# ---------------------------------------------------------------- shaders --
[shaders-off]
profile-desc=No user shaders
glsl-shaders=

[shaders-anime]
profile-desc=Anime4K Restore (M) + CfL
glsl-shaders=~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/CfL_Prediction.glsl

[shaders-anime-full]
profile-desc=Anime4K Restore + CNN x2 upscale + CfL (heavier)
glsl-shaders=~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl;~~/shaders/CfL_Prediction.glsl

# --------------------------------------------------------------- quality --
[max-quality]
profile-desc=Max quality scaler (slower)
scale=ewa_lanczos4sharpest
cscale=ewa_lanczossharp
scale-antiring=0.3
deband-iterations=4

[cine]
profile-desc=Cinema: gentle scaler, no interpolation
scale=spline36
cscale=spline36
interpolation=no
deband=yes
deband-iterations=1

# ----------------------------------------------------------------- audio --
[loudnorm]
profile-desc=EBU R128 loudness normalisation
af=lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11]

[dynaudnorm]
profile-desc=Gentle dynamic normalisation
af=lavfi=[dynaudnorm=f=250:g=5:p=0.9:r=0.9]

# ----------------------------------------------------------------- video --
[gpu-vulkan]
profile-desc=Vulkan renderer (A/B against d3d11)
gpu-api=vulkan
gpu-context=winvk
hwdec=vulkan

[gpu-d3d11]
profile-desc=D3D11 renderer with zero-copy (default)
gpu-api=d3d11
gpu-context=d3d11
hwdec=d3d11va
d3d11va-zero-copy=yes

# ------------------------------------------------------------ subtitles --
[subs-panel]
profile-desc=Netflix-style translucent subtitle panel
sub-border-style=background-box
sub-back-color="#000000B3"
sub-shadow-offset=10
sub-outline-size=0
sub-blur=0

[subs-cinema]
profile-desc=Cinema subtitles: shadow only, no outline
sub-outline-size=0.35
sub-outline-color="#00000073"
sub-shadow-offset=1.6
sub-back-color="#0000008C"
sub-blur=0.6
sub-margin-y=64

# -------------------------------------------------------------- window --
[windowed-full]
profile-desc=Maximise the window to the panel
autofit=100%
autofit-larger=1920x1200
geometry=1920x1200+0+0
force-window-position=yes

