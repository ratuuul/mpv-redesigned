# =============================================================================
#  SUBTITLES - typography, colour, separation
#
#  Font: Geist Medium (already in ~~/fonts). It has a tall x-height, a
#  large open counter and unambiguous I/l/1 - everything you want when text
#  is small and bright on a dark panel.
#
#  The two levers that make subtitles look "designed" rather than default:
#    - sub-blur=0.3            softens the border+shadow edge
#    - sub-border-style=...    switches between outline / Netflix-style box
#
#  NOTE: ASS/SSA files carry their own styling and ignore most --sub-*
#  options. The overrides at the bottom gently restyle the `Default` style
#  of fansub ASS so they match the plain-text subtitles.
# =============================================================================

# ------------------------------------------------------------------- font --
sub-font='Geist Medium'
sub-font-size=40
# Warm off-white - pure white is harsher on a dark panel.
sub-color="#F5F2EF"
sub-bold=no
sub-italic=no

# ------------------------------------------------------------ separation --
# A hairline outline plus a soft shadow. Not the heavy "Crunchyroll slab".
sub-outline-size=1.15
sub-outline-color="#000000C0"
sub-shadow-offset=1.1
sub-back-color="#000000A6"
# The single biggest "premium" upgrade: softens the border and shadow.
sub-blur=0.3
sub-border-style=outline-and-shadow

# ---------------------------------------------------------------- layout --
# Sizes are scaled off a 720p-height reference: 40 => ~60 px at 1080p.
sub-margin-y=42
sub-margin-x=120
sub-align-x=center
sub-align-y=bottom
sub-justify=center

# -------------------------------------------------------------- rendering --
sub-hinting=none
sub-shaper=complex
# `scale` keeps ASS dialogue scalable but leaves positioned signs alone.
sub-ass-override=scale
sub-ass-scale-with-window=no
sub-scale-signs=no
# Let subtitles sit inside the letterbox bars of 2.35:1 films.
sub-ass-force-margins=yes

# ------------------------------------------- gentle restyle of ASS subs --
# Format: [Style.]Field=Value.  ASS colours are &HAABBGGRR (00 = opaque).
# Only `Default` is touched so fansub signs/italics keep their identity.
sub-ass-style-overrides=Default.OutlineColour=&HA0000000,Default.Outline=1.15,Default.Shadow=1.1,Default.PrimaryColour=&H00F5F2EF

# ------------------------------------------------- bitmap (PGS/VobSub) --
# These are pre-rendered images and cannot be restyled - only softened.
sub-gauss=0.6
sub-gray

