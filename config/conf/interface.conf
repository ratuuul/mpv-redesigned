# =============================================================================
#  INTERFACE - window chrome, OSD, screenshots, cursor
# =============================================================================

# ------------------------------------------------------------ window chrome --
# `border=yes` + `title-bar=no` is the sweet spot on Windows 10:
# mpv hides the caption but keeps WS_CAPTION, so Aero-Snap (Win+Arrow),
# the taskbar, Alt-Tab and the minimise button all keep working.
# (`border=no` would give a cleaner edge but breaks Aero-Snap and removes
# the maximise button entirely.)
border=yes
title-bar=no
# Click-and-drag the video to move the window (needs a frameless look).
window-dragging=yes
# Window size follows the video, capped to the panel.
#
# NOTE: do NOT set `autofit` here. mpv parses a bare percentage as
# "100%x0", which forces the window to the full screen width and pushes
# it off the right edge of the panel - taking uosc's control bar with it.
# --autofit-larger is the safe way to keep 4K videos from overflowing.
autofit-larger=1920x1200
keepaspect=yes
keepaspect-window=no
fullscreen=no
# Allow snapping to screen edges (Windows only).
snap-window=yes

# -------------------------------------------------------------------- OSD --
# The skin draws the controls; mpv's OSD is used for text messages only
# ("Screenshot saved", track changes, speed).
osd-level=1
osd-bar=no
osd-on-seek=no
osd-font='Geist Medium'
osd-font-size=32
osd-color="#FFFFFF"
osd-outline-color="#000000"
osd-outline-size=1.4
osd-back-color="#000000A0"
osd-shadow-offset=1
osd-border-style=outline-and-shadow
osd-bold=yes
# Centre the messages near the top, clear of the skin's title bar.
osd-align-x=center
osd-align-y=top
osd-margin-y=56
osd-duration=1600

# ----------------------------------------------------------------- cursor --
# Hide the pointer after 2 s of stillness.
cursor-autohide=2000

# ------------------------------------------------------------ screenshots --
# PNG is lossless. `video` = original resolution without subtitles.
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=3
screenshot-template=~~/screenshots/%F-%p%n

# --------------------------------------------------------------- windows --
# mpv registers itself with Windows so the media flyout shows a proper
# icon/name instead of "Unknown app". Run once, elevated is not required:
#     mpv --register
# (undo with: mpv --unregister)
media-controls=yes
input-media-keys=yes

