# =============================================================================
#  sponsorblock_minimal - skip sponsor/self-promo segments (YouTube)
#
#  Pure Lua + curl.exe. The popular po5/mpv_sponsorblock script has been
#  unmaintained since 2024 and needs Python; this one does not.
# =============================================================================
#
# categories
# ----------
# Semicolon-separated list of SponsorBlock categories to fetch and skip.
# SEPARATOR IS ";"  (a comma also works, but semicolons are what `mpv --script-opts`
# needs on the command line, so keep them for consistency).
#
#   sponsor         paid promotion / ad read baked into the video      <- the classic one
#   intro           title card, animated intro, cold-open animation
#   outro           endcards and credits (often 20-60s of dead air)
#   selfpromo       unpaid self-promotion: merch, Patreon, other videos
#   interaction     "like and subscribe", "comment below", subscribe reminders
#   preview         recap of previous episodes / preview of what's coming
#   music_offtopic  non-music sections inside music videos
#
# To trim the list, delete entries. Examples:
#   categories=sponsor                         # most conservative, sponsors only
#   categories=sponsor;intro;outro              # ads plus dead air at both ends
#   categories=sponsor;selfpromo;interaction    # ads plus all the pitching
#
# OPINIONATED, REMOVE IF THEY ANNOY YOU:
#   preview         cuts recaps/previews, which can clip legitimate story content
#                   in episodic or essay-style videos
#   music_offtopic  only meaningful for music videos; harmless elsewhere but it
#                   can chop the talking intro of a music video
#
# Every category above is sent to the API in a single request, so adding
# categories costs no extra network round-trips.
#
categories=sponsor;intro;outro;selfpromo;interaction;preview;music_offtopic

# Set to "true" to use SHA-256 hash-prefix privacy mode instead of sending the
# raw video ID. The script shells out to `sha256sum` for this, which is NOT
# present on a stock Windows PATH, so hash mode would return no segments here.
# Leave false on this machine.
hash=false
