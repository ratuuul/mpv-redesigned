# =============================================================================
#  ytsubs - YouTube subtitle picker
#
#  Alt+s        open the subtitle menu for the current YouTube video
#  Alt+Shift+s  load the picked subtitle as the SECONDARY (top of screen) one
# =============================================================================

# Where downloaded subtitles are cached.
cache_dir=~~/cache/ytsubs

# YouTube serves both natively, so no conversion is needed.
# 'srt' is the safest choice; 'vtt' is a good second.
sub_format=srt

# Offer the creator-uploaded subtitles.
offer_manual=yes

# Offer the auto-generated captions (ASR). These exist in every language
# YouTube supports, which is why they are collapsed by display name.
offer_auto=yes

# Maximum number of auto-caption entries to list.
max_auto=60

# Automatically load a subtitle when a YouTube video starts.
# Languages are tried in the order given.
auto_select=no
auto_langs=en,ja

# Timeout in seconds for the subtitle download.
timeout=20
