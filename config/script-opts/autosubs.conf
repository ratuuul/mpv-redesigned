# off | prompt | single
auto_load=prompt
# Seconds to wait after the file starts before searching
delay=2.5
# Only these extensions trigger the lookup (semicolon separated)
extensions=mkv;mp4;avi;mov;m4v;webm;ts
# How many query variants to try before giving up: 1-8
# 5 covers every rung for a movie; 6-8 additionally try the shortened-title
# fallback rungs for series whose title carries a year.
query_ladder=5
# Minimum similarity score 0.0-1.0 for a candidate to be shown
min_score=0.45
# Prefer an exact file-hash match before any text search
hash_first=yes
