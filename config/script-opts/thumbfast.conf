# =============================================================================
#  thumbfast - seekbar thumbnail previews
#
#  thumbfast spawns a second, headless mpv and streams raw frames back over
#  a pipe. uosc AND ModernZ only *render* the previews - without thumbfast
#  the seekbar hover box stays empty.
# =============================================================================

# Second mpv instance decodes in software. On this Intel iGPU a second
# d3d11va decoder occasionally deadlocks with the main one, and these are
# small thumbnails - software decode is plenty fast.
hwdec=no

# Do not fetch over the network. With network=yes a thumbnail of a URL
# would trigger a *second* download, which doubles YouTube bandwidth and
# stalls.
network=no

# Required for the Windows pipe path.
direct_io=no

# Thumbnail width multiplier (mpv >= 0.38).
scale_factor=1.0

# NOTE: the time budget per thumbnail (max_thumb_time) was an option in
# older thumbfast builds. The shipped version does not have it any more, and
# mpv logged "unknown key 'max_thumb_time', ignoring" on every start.
