# =============================================================================
#  ModernZ - OSC theme
#  Only the values that differ from the script's defaults are listed here.
#  Full reference: skins/modernz/modernz.lua  (or the upstream repo)
# =============================================================================

# ------------------------------------------------------------------ layout --
# default | compact | mini | seekbar
layout=default

# ------------------------------------------------------------------- icons --
# fluent | material
icon_theme=fluent
# mixed | filled | outline
icon_style=mixed
# Text font for titles, timecode, tooltips.
# (Icons use the bundled modernz-icons font automatically.)
font=Geist Medium

# ----------------------------------------------------------------- colour --
# Accent colour, matched to the Liquid Glass accent (E8553A).
osc_color=#E8553A
seekbarfg_color=#E8553A
seek_handle_color=#FF8A5C
seek_handle_border_color=#FF8A5C
# Seekbar track: translucent white so it reads over any content.
seekbarbg_color=#FFFFFF40
# Chapter nibbles on the seekbar.
nibble_color=#FFFFFF60
nibble_current_color=#E8553A
nibbles_style=gap
# Text colours.
time_color=#FFFFFF
title_color=#FFFFFF
chapter_title_color=#FFFFFFB0
window_title_color=#FFFFFF
window_controls_color=#FFFFFF
side_buttons_color=#FFFFFF
playpause_color=#FFFFFF
tooltip_font_size=14

# ------------------------------------------------------------- behaviour --
# Fade the OSC in and out instead of popping it.
fadein=yes
fadeduration=200
osc_fade_strength=100
# Hide after 1.5 s of stillness.
hidetimeout=1500
# Show the OSC on seek (it is the only feedback when using the keyboard).
osc_on_seek=yes
# Show it briefly when a file starts.
osc_on_start=both
# Keep subtitles above the OSC.
sub_margins=yes
dynamic_margins=yes
# Scale the OSC with the video.
vidscale=auto

# ------------------------------------------------------------ thumbnails --
# Rounded thumbnail frames on the seekbar (needs scripts/thumbfast.lua).
thumbnail_box_radius=8
thumbnail_box_padding=4
thumbnail_box_color=#000000A0
thumbnail_box_outline=#FFFFFF30
thumbnail_box_outline_size=1

# ------------------------------------------------------------- window bar --
# mpv's native title bar is hidden (title-bar=no in conf/interface.conf),
# so ModernZ draws its own.
window_top_bar=no
show_window_title=no
window_controls=yes
windowcontrols_independent=yes
