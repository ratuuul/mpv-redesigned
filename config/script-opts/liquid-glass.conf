# Liquid Glass skin - runtime options
#
# Liquid Glass (the uosc fork in scripts/uosc/) is the ACTIVE skin.
# To swap it for ModernZ:  switch-skin.cmd modernz
# To come back:            switch-skin.cmd liquidglass

liquid_glass_theme=dark
liquid_glass_intensity=1.0
liquid_glass_accent=E8553A
liquid_glass_show_frost_noise=yes
reduced_motion=no

# The speedometer tick used to spawn a PowerShell subprocess on every scroll
# event - real CPU jitter and antivirus noise on this iGPU box.
# Set to yes to bring the click back.
liquid_glass_tick_sound=no

# Seconds remaining at/below which the floating "Next: <video>" pill appears
# at the end of a video when another playlist item is queued.
liquid_glass_next_video_threshold=120

# Small-window minimums (px). The player will refuse to shrink below these
# floors so controls can never overlap. Landscape values are used for normal
# 16:9-ish videos; portrait values kick in for vertical / reels / shorts.
# (Lowered from 1240x420 / 510x480 - the old floor made side-by-side work
#  impossible on this 1920x1200 panel.)
liquid_glass_min_width_landscape=760
liquid_glass_min_height_landscape=320
liquid_glass_min_width_portrait=360
liquid_glass_min_height_portrait=360
