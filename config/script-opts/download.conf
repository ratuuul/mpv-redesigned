# =============================================================================
#  download.lua - options
#
#  Ctrl+d        start the download of the current video
#  Ctrl+Shift+d  cancel the running download
#
#  Every option below is read at startup. Restart mpv (or reload the script
#  with the "console" script) after editing this file.
# =============================================================================

# -----------------------------------------------------------------------------
#  download_dir - where the finished file is saved
#
#  ~ expands to your user profile, so the default below resolves to
#      C:\Users\<you>\Videos\mpv-downloads
#
#  The folder is created if it does not exist. Existing files are never
#  overwritten: "video.mp4" becomes "video [2].mp4" if it already exists.
#
#  Set this to an absolute path to download somewhere else, e.g.
#      download_dir=D:\Media\Downloads
# -----------------------------------------------------------------------------
download_dir=~/Videos/mpv-downloads

# -----------------------------------------------------------------------------
#  filename_template - the file name yt-dlp writes
#
#  These are yt-dlp output template fields:
#      %(title)s      video title
#      %(id)s         video id
#      %(ext)s        file extension
#      %(uploader)s   channel / uploader name
#      %(upload_date)s
#  Any other yt-dlp field works as well.
# -----------------------------------------------------------------------------
filename_template=%(title)s [%(id)s].%(ext)s

# -----------------------------------------------------------------------------
#  quality - which stream to download
#
#  best        use the format mpv itself negotiated for playback
#              (the "ytdl-format" set by the quality menu, if any)
#  <number>    cap the height in pixels, e.g. 1080, 720, 480, 360
#              (picks the best video stream at or below that height and
#               merges it with the best audio stream)
#  <selector>  a raw yt-dlp format string, e.g.
#              "bv*[height<=720]+ba/b[height<=720]"
#
#  "best" is the default, so the download matches what you are watching.
# -----------------------------------------------------------------------------
quality=best

# -----------------------------------------------------------------------------
#  format - a raw yt-dlp format selector
#
#  Leave this empty to use the `quality` option above. If it is not empty it
#  wins over `quality` completely, e.g.
#      format=bv*[height<=1080]+ba/b[height<=1080]
# -----------------------------------------------------------------------------
format=

# -----------------------------------------------------------------------------
#  extra_args - extra arguments for yt-dlp
#
#  Space separated, for example
#      extra_args=--embed-metadata --embed-thumbnail
#  or to skip subtitles and keep the original container
#      extra_args=--no-write-subs --no-write-auto-subs
# -----------------------------------------------------------------------------
extra_args=

# -----------------------------------------------------------------------------
#  use_ytdl_raw_options - reuse mpv's yt-dlp options for the download
#
#  When enabled, the ytdl-raw-options from mpv.conf are passed to yt-dlp as
#  well. That is what makes age restricted, members-only and bot-checked
#  videos downloadable, because the browser cookies mpv uses are reused.
#
#  Leave it off if you do not want yt-dlp to touch your browser profile.
# -----------------------------------------------------------------------------
use_ytdl_raw_options=no

# -----------------------------------------------------------------------------
#  show_cancel_hint - show "Ctrl+Shift+D: cancel" in the progress message
# -----------------------------------------------------------------------------
show_cancel_hint=yes
