# =============================================================================
#  mpv-webm - cut a clip out of the current video
#
#  Default output_format is webm-vp8, which is CPU-only and painfully slow.
#  "avc" (H.264/AAC) is far faster and plays everywhere.
# =============================================================================

output_format=avc
# Higher quality (CRF 10 is the script default; 18 is a good balance).
crf=18
# Target clip size in kB. 0 disables the size targeting.
target_filesize=5000
# Keep the clip at the source resolution.
scale_height=-1
# Write next to the source video.
output_directory=[[]]
