# =============================================================================
#  uosc (Liquid Glass) options
#
#  Liquid Glass-specific options live in script-opts/liquid-glass.conf.
# =============================================================================

# ---------------------------------------------------------------- always on --
# By default uosc only shows the control bar and the progress bar when the
# mouse is near them. These make them permanent:
#
#   video      - while a video is playing
#   paused     - while paused
#   windowed   - while the window is not fullscreen
#   fullscreen - while fullscreen
#   idle       - while mpv is idle
#
# Pick the ones you want. Remove the line entirely to go back to
# show-on-hover.
controls_persistency=
timeline_persistency=

# The top bar (title + window buttons) stays hover-only.
top_bar=no
top_bar_size=0
top_bar_controls=no
top_bar_title=no
top_bar_alt_title=no
top_bar_persistency=

# Volume and speed indicators stay hover-only.
volume_persistency=
speed_persistency=
