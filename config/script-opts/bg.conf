# =============================================================================
#  bg.lua - idle photo background
#
#  Options for ~~/scripts/bg.lua.  Reload the player after editing.
#  Bindings live in input.conf (Ctrl+Shift+K -> script-binding bg/next).
# =============================================================================

# Turn the whole feature off without removing the script.
enabled=yes

# Keywords for sources that accept them (loremflickr / unsplash).
# Comma-separated; one is picked at random for every new photo.  picsum
# ignores keywords and always shows a random photo.
keywords=nature,landscape,minimal,city,night

# Source order.  Each one is tried in turn until a valid image arrives.
#   loremflickr  https://loremflickr.com/<w>/<h>/<kw>?lock=<seed>
#   picsum       https://picsum.photos/<w>/<h>?random=<seed>
#   unsplash     https://source.unsplash.com/<w>x<h>/?<kw>
#
# Only picsum is enabled.  The other two are dead ends (checked 2026-10-21):
#   loremflickr  -> HTTP 500 on every request, the service is broken
#   unsplash     -> HTTP 503, the random endpoint was retired
# Leaving them in the list only cost ~1.3 s per photo, because every
# request had to fail first.  The script still understands both names, so
# re-enabling one is a matter of putting it back in this list.
sources=picsum

# Requested photo size, in pixels.  The photo is scaled to the window; a
# size in the region of your screen's resolution keeps it sharp.
width=1920
height=1200

# Keep at most this many photos in ~~/cache/bg/ (oldest are deleted first).
cache_size=20

# Seconds to wait after startup before showing the first photo.  Gives mpv
# time to load a file passed on the command line, in which case the
# background is never shown.
initial_delay=0.2

# Per-source download timeout, in seconds.
timeout=20

# Value of force-media-title for the photo, so the cache filename never
# shows up in the window title / skin.  Keep it short.
title=Background

# Draw the idle text overlay on top of the photo.
show_prompt=yes
prompt=Drop a file or link to play
# Fonts come from ~~/fonts (Geist / Inter are installed there).
font=Geist SemiBold
font_size=80
font_sub=Inter Medium
font_size_sub=32
